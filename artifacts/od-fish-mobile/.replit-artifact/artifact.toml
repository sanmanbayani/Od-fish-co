kind = "mobile"
previewPath = "/mobile/"
title = "OD Fish Co. Mobile"
description = "The OD Fish Co. consumer mobile app for Mumbai households. Customers sign in with a phone OTP, browse the day's catch of fresh sea fish, prawns, shellfish and dried fish with Marathi names and disclosed net weights, manage saved delivery addresses with pincode serviceability, build a cart priced live from the server, and check out into a slotted same-day delivery with COD, UPI or card. They then track the order through its lifecycle and read out a 4-digit OTP to the rider at handover."
version = "1.0.0"
id = "artifacts/od-fish-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18809

[services.development]
run = "pnpm --filter @workspace/od-fish-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/od-fish-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/od-fish-mobile", "run", "serve" ]

[services.env]
PORT = "18809"
BASE_PATH = "/mobile/"
